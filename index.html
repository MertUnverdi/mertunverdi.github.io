<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stake Hedge Betting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stakeBg: '#1e293b',
                        stakeCard: '#334155',
                        stakeBorder: '#475569',
                        stakeText: '#f1f5f9',
                        stakeSubtle: '#94a3b8',
                        stakeAccent: '#3b82f6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-stakeBg text-stakeText font-sans min-h-screen p-6">
<div class="max-w-2xl mx-auto bg-stakeCard p-6 rounded-2xl shadow-lg border border-stakeBorder">
    <h1 class="text-2xl font-bold text-center mb-6 text-stakeAccent">Hedge Betting Hesaplayıcı</h1>

    <div class="mb-4">
        <label class="block mb-1 text-stakeSubtle">Toplam Yatırım ($):</label>
        <input id="totalInvestment" type="number" class="w-full px-3 py-2 bg-stakeBg text-white border border-stakeBorder rounded-xl" placeholder="100" />
    </div>

    <div id="inputs" class="space-y-3"></div>
    <button onclick="addInput()" class="text-stakeAccent hover:underline text-sm mt-2">+ Oran Ekle</button>

    <button onclick="calculateHedge()" class="w-full mt-6 bg-stakeAccent hover:bg-blue-600 text-white py-2 rounded-xl font-semibold transition-all duration-300">Hesapla</button>

    <div id="results" class="mt-8 hidden">
        <h2 class="text-lg font-semibold text-green-400 mb-2">Sonuçlar:</h2>
        <ul id="betList" class="space-y-1 text-sm"></ul>
        <p id="expected" class="mt-3 font-semibold text-green-300"></p>
    </div>

    <div id="historySection" class="mt-10">
        <h3 class="text-md font-semibold mb-2 text-stakeAccent">Geçmiş Hesaplamalar</h3>
        <ul id="history" class="space-y-2 text-sm text-stakeSubtle"></ul>
        <button onclick="clearHistory()" class="mt-2 text-red-400 hover:underline text-xs">Geçmişi Temizle</button>
    </div>
</div>

<script>
    function addInput() {
        const div = document.createElement('div');
        div.className = "flex items-center gap-2";
        div.innerHTML = `
        <input type="number" step="any" class="odd-input w-full px-3 py-2 bg-stakeBg text-white border border-stakeBorder rounded-xl" placeholder="Oran girin">
        <button onclick="removeInput(this)" class="text-red-400 hover:text-red-600 text-lg">✕</button>
      `;
        document.getElementById('inputs').appendChild(div);
    }

    function removeInput(btn) {
        btn.parentElement.remove();
    }

    function calculateHedge() {
        const inputElements = document.querySelectorAll('.odd-input');
        const odds = Array.from(inputElements)
            .map(input => parseFloat(input.value))
            .filter(val => !isNaN(val) && val > 0);

        const totalInvestmentInput = document.getElementById('totalInvestment');
        const totalInvestment = parseFloat(totalInvestmentInput.value) || 100;
        localStorage.setItem('stake_total_investment', totalInvestment);

        const resultsDiv = document.getElementById('results');
        const betList = document.getElementById('betList');
        const expected = document.getElementById('expected');

        if (odds.length < 2) {
            alert("Hedge betting için en az 2 oran girilmelidir!");
            resultsDiv.classList.add('hidden');
            return;
        }

        let totalInverse = odds.reduce((acc, odd) => acc + 1 / odd, 0);
        const bets = odds.map(odd => (totalInvestment * (1 / odd)) / totalInverse);
        const expectedPayout = (bets[0] * odds[0]).toFixed(2);

        betList.innerHTML = '';
        odds.forEach((odd, i) => {
            const li = document.createElement('li');
            li.textContent = `Oran: ${odd.toFixed(2)} → Bahis: ${bets[i].toFixed(2)}$`;
            betList.appendChild(li);
        });

        expected.textContent = `Beklenen Geri Dönüş: ${expectedPayout}$`;
        resultsDiv.classList.remove('hidden');

        saveToHistory(odds, bets, expectedPayout);
        displayHistory();
    }

    function saveToHistory(odds, bets, payout) {
        const history = JSON.parse(localStorage.getItem('stake_bet_history') || '[]');
        history.unshift({ date: new Date().toLocaleString(), odds, bets, payout });
        localStorage.setItem('stake_bet_history', JSON.stringify(history.slice(0, 5)));
    }

    function displayHistory() {
        const historyList = document.getElementById('history');
        const history = JSON.parse(localStorage.getItem('stake_bet_history') || '[]');
        historyList.innerHTML = '';

        history.forEach(entry => {
            const item = document.createElement('li');
            item.innerHTML = `
          <div class="bg-stakeBg p-3 rounded-xl border border-stakeBorder">
            <div class="text-xs text-stakeSubtle mb-1">${entry.date}</div>
            <div class="text-sm">Odds: ${entry.odds.map(o => o.toFixed(2)).join(', ')}</div>
            <div class="text-sm">Payout: ${entry.payout}$</div>
          </div>
        `;
            historyList.appendChild(item);
        });
    }

    function clearHistory() {
        localStorage.removeItem('stake_bet_history');
        displayHistory();
    }

    window.onload = () => {
        addInput();
        addInput();
        const savedInvestment = localStorage.getItem('stake_total_investment');
        if (savedInvestment) {
            document.getElementById('totalInvestment').value = savedInvestment;
        } else {
            document.getElementById('totalInvestment').value = 100;
        }
        displayHistory();
    }
</script>
</body>
</html>
