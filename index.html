<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hedge Betting Hesaplayıcı</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">
    <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">Hedge Betting Hesaplayıcı</h1>

    <div id="inputs" class="space-y-2">
      <!-- İlk 2 input buraya dinamik olarak eklenecek -->
    </div>

    <button onclick="addInput()" class="mt-3 text-sm text-blue-600 hover:underline">+ Oran Ekle</button>

    <div class="mt-6">
      <button onclick="calculateHedge()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold">Hesapla</button>
    </div>

    <div id="results" class="mt-6 hidden">
      <h2 class="text-xl font-semibold mb-2 text-gray-700">Sonuçlar</h2>
      <ul id="betList" class="space-y-1 text-gray-800 text-sm"></ul>
      <p id="expected" class="mt-2 font-bold text-green-700"></p>
    </div>
  </div>

  <script>
    function addInput() {
      const div = document.createElement('div');
      div.className = "flex items-center gap-2";
      div.innerHTML = `
        <input type="number" step="any" class="odd-input w-full px-3 py-2 border rounded-lg" placeholder="Oran girin">
        <button onclick="removeInput(this)" class="text-red-500 hover:text-red-700 text-lg">✕</button>
      `;
      document.getElementById('inputs').appendChild(div);
    }

    function removeInput(btn) {
      btn.parentElement.remove();
    }

    function calculateHedge() {
      const inputContainers = document.querySelectorAll('#inputs .odd-input');
      const odds = [];

      inputContainers.forEach(input => {
        const val = parseFloat(input.value);
        if (!isNaN(val) && val > 0) odds.push(val);
      });

      const resultsDiv = document.getElementById('results');
      const list = document.getElementById('betList');
      const expectedText = document.getElementById('expected');
      list.innerHTML = '';

      if (odds.length < 2) {
        alert("Hedge betting için en az 2 oran girilmelidir!");
        resultsDiv.classList.add("hidden");
        return;
      }

      let totalInverse = 0;
      for (let odd of odds) totalInverse += 1 / odd;

      const bets = odds.map(o => (100 * (1 / o)) / totalInverse);
      const expectedPayout = (bets[0] * odds[0]).toFixed(2);

      odds.forEach((odd, i) => {
        const li = document.createElement('li');
        li.textContent = `Oran: ${odd.toFixed(2)} → Bahis Miktarı: ${bets[i].toFixed(2)}$`;
        list.appendChild(li);
      });

      expectedText.textContent = `Beklenen Geri Dönüş: ${expectedPayout}$`;
      resultsDiv.classList.remove("hidden");
    }

    // Sayfa yüklendiğinde otomatik olarak 2 input ekle
    window.onload = () => {
      addInput();
      addInput();
    };
  </script>
</body>
</html>
