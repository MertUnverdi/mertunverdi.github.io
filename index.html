<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hedge Betting Hesaplayıcı</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #f5c518;
        }
        input[type="number"],
        input[type="file"] {
            padding: 8px;
            margin: 4px;
            background-color: #1b263b;
            color: white;
            border: 1px solid #415a77;
            border-radius: 6px;
        }
        button {
            background-color: #f5c518;
            color: #000;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        .odds-inputs {
            margin-bottom: 10px;
        }
        .result, .history {
            background-color: #1b263b;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<h1>Hedge Betting Hesaplayıcı</h1>

<label for="investment">Toplam Yatırım ($):</label>
<input type="number" id="investment" value="100" step="0.01" /><br />

<div class="odds-inputs" id="oddsContainer"></div>
<button onclick="addOddInput()">+ Oran Ekle</button>
<button onclick="removeOddInput()">- Oran Kaldır</button>
<button onclick="calculateHedgeBets()">Hesapla</button>
<button onclick="clearHistory()">Geçmişi Temizle</button>
<br /><br />

<input type="file" id="imageInput" accept="image/*" />
<button onclick="extractOddsFromImage()">📸 Görselden Oran Yükle</button>

<div class="result" id="result"></div>
<div class="history" id="history"></div>

<script>
    const oddsContainer = document.getElementById("oddsContainer");
    const historyDiv = document.getElementById("history");
    const investmentInput = document.getElementById("investment");

    function loadInvestment() {
        const saved = localStorage.getItem("investment");
        if (saved) investmentInput.value = saved;
    }

    function saveInvestment() {
        localStorage.setItem("investment", investmentInput.value);
    }

    function addOddInput(value = "") {
        const input = document.createElement("input");
        input.type = "number";
        input.step = "0.01";
        input.placeholder = "Oran";
        input.value = value;
        oddsContainer.appendChild(input);
    }

    function removeOddInput() {
        if (oddsContainer.children.length > 2) {
            oddsContainer.removeChild(oddsContainer.lastChild);
        }
    }

    function calculateHedgeBets() {
        saveInvestment();
        const odds = Array.from(oddsContainer.querySelectorAll("input"))
            .map((input) => parseFloat(input.value))
            .filter((v) => !isNaN(v) && v > 1);

        const investment = parseFloat(investmentInput.value);
        if (odds.length < 2) {
            alert("Hedge betting için en az 2 oran girilmelidir!");
            return;
        }

        const totalInverseOdds = odds.reduce((sum, odd) => sum + 1 / odd, 0);
        const bets = odds.map((odd) => ((investment * (1 / odd)) / totalInverseOdds));
        const expectedPayout = bets[0] * odds[0];

        let html = "<h3>Hesaplama Sonucu:</h3>";
        bets.forEach((bet, i) => {
            html += `Oran: ${odds[i].toFixed(2)} → Bahis: ${bet.toFixed(2)}$<br/>`;
        });
        html += `<strong>Beklenen Geri Dönüş: ${expectedPayout.toFixed(2)}$</strong>`;
        document.getElementById("result").innerHTML = html;

        const history = JSON.parse(localStorage.getItem("hedgeHistory") || "[]");
        history.unshift({ date: new Date().toLocaleString(), odds, bets });
        localStorage.setItem("hedgeHistory", JSON.stringify(history));
        showHistory();
    }

    function showHistory() {
        const history = JSON.parse(localStorage.getItem("hedgeHistory") || "[]");
        if (history.length === 0) {
            historyDiv.innerHTML = "Geçmiş hesaplama bulunamadı.";
            return;
        }
        let html = "<h3>Geçmiş Hesaplamalar:</h3>";
        history.forEach((item) => {
            html += `<div style='margin-bottom:10px;'>[${item.date}] → `;
            item.odds.forEach((o, i) => {
                html += `(${o.toFixed(2)}: ${item.bets[i].toFixed(2)}$) `;
            });
            html += "</div>";
        });
        historyDiv.innerHTML = html;
    }

    function clearHistory() {
        localStorage.removeItem("hedgeHistory");
        showHistory();
    }

    async function extractOddsFromImage() {
        const file = document.getElementById("imageInput").files[0];
        if (!file) return;

        const worker = await Tesseract.createWorker("eng");
        const {
            data: { text },
        } = await worker.recognize(file);
        await worker.terminate();

        const matches = [...text.matchAll(/\b\d{1,2}[.,]\d{2}\b/g)];
        const foundOdds = matches.map((m) => parseFloat(m[0].replace(",", "."))).filter((v) => v > 1);

        foundOdds.forEach(addOddInput);
    }

    // Init
    addOddInput();
    addOddInput();
    loadInvestment();
    showHistory();
</script>
</body>
</html>
